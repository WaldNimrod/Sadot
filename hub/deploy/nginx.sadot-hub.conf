# sadot.nimrod.bio — static hub vhost (Sadot client hub, Niv Sadot)
# Deploy to waldhomeserver: /etc/nginx/sites-available/sadot-hub -> symlink into sites-enabled -> reload.
# Port 8094 (web band 8080-8499). Verified free 2026-07-10 via `ss -tln | grep 8094` on waldhomeserver.
# Register the listener in the port canon (port-registry.yaml, Team 60 + 100 + 00 sign-off) before first start.
#
# DELIBERATE DIFFERENCE from the il-mg.nimrod.bio precedent: NO auth_basic / Cloudflare Access gate.
# This hub is meant to be freely reachable by the client (Niv Sadot) without any login step — team_00
# instruction, 2026-07-10. Keep it that way; do not add an auth layer without a fresh explicit ask.
server {
    listen 127.0.0.1:8094;
    server_name sadot.nimrod.bio;

    root /var/www/sadot-hub;     # rsync target: hub/dist/ published here in full
    index index.html;

    # Not meant for search-engine indexing (client-only content) but openly link-accessible — no login gate.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
