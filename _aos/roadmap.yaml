# roadmap.yaml — L0 Work Package State Registry (Schema v1.1)
# -----------------------------------------------------------
# This file is the SSOT for WP state in this project.
# Mirrors AOS DB schema — enables clean L0→L2 migration.
# One entry per work package.
#
# SSOT RULE: roadmap.yaml project.profile is AUTHORITATIVE.
# dashboard_config.yaml profile = read-only mirror. Divergence → roadmap.yaml wins.
#
# ENUM VALUES (canonical):
#   status:             PLANNED | IN_PROGRESS | COMPLETE | BLOCKED
#   track:              A | B
#   current_lean_gate:  L-GATE_ELIGIBILITY | L-GATE_CONCEPT | L-GATE_SPEC | L-GATE_BUILD | L-GATE_VALIDATE | COMPLETE
#   lod_status:         LOD100 | LOD200 | LOD300 | LOD400 | LOD500
#   profile:            L0 | L2 | L3
#
# WP ID / hub-DB collision-safety note (team_110, 2026-07-08):
#   `work_packages.id` is a GLOBAL primary key in the hub Postgres schema — plain `S00N-P00N-WP00N` triples have
#   already collided across sibling spokes (see agents-os/_COMMUNICATION/team_100/RISK_SUMMARY_DUAL_SPOKE_WP_ID_COLLISIONS_v1.0.3.md).
#   Sadot therefore prefixes every `id:` field with `SDT-` (the value that syncs to the hub DB). Directory names under
#   `_aos/work_packages/` and all internal cross-references (spec_ref, this file's own comments) stay UNPREFIXED
#   (`S001-P001-WP001/`) per WP_ID_STANDARD.md — only the `id:` field itself carries `SDT-`.
#
# TRACK CLASSIFICATION note (team_110, 2026-07-08):
#   roadmap.yaml has no native field yet for RESEARCH vs CONTENT vs 3D_CREATIVE classification (per the team_120
#   handoff's instruction to "classify each WP"). Tagged via `notes:` (`CLASS=RESEARCH|CONTENT|3D_CREATIVE`) until
#   team_100 canonizes a real field. RESEARCH WPs (team_80) are ADR044 Track 4 — advisory, NOT part of the gate
#   process, no LOD chain required; `current_lean_gate`/`lod_status` are set to schema-required nominal values only.

project:
  id: "sadot"
  name: "Sadot — Landscape Architecture"
  profile: L0                          # L0 | L2 | L3
  lifecycle_archetype: 3D_CREATIVE     # base for validation now; upgrades to LANDSCAPE_DESIGN (sub-archetype inheriting 3D_CREATIVE)
                                       # once team_100 authors the hub PLA + README update per the GCR filed at
                                       # _COMMUNICATION/team_100/GOVERNANCE_CHANGE_REQUEST_LANDSCAPE_DESIGN_ARCHETYPE_INHERITANCE_v1.0.0.md
                                       # (team_110, 2026-07-08). See: methodology/lifecycle-archetypes/README.md
  lean_kit_version: "3.4.0+65fa386"
  created: "2026-07-08"
  owner: "sadot_sd"         # system_designer team ID
  active_milestone: "S001"   # currently active milestone
  notes: "Roadmap refined + populated by team_110 2026-07-08 per HANDOFF_TO_NEXT_team_110_SADOT_BUILDOUT_2026-07-08_v1.0.0.md (ADR045 full execution authority). S001 broadened from team_120's placeholder ('Initial domain research and environment bootstrap') to cover environment/KB completion + research + site-analysis/brief — no WP had ever been registered against the old S001 label, so no renumbering occurred (WP-ID stage numbers are frozen-forward per WP_ID_STANDARD.md, but an empty stage's description is not)."

# WP ID FORMAT: S[stage]-P[program]-WP[number]  (id: field carries an additional SDT- prefix — see note above)
#
#   S[stage]    — Major product milestone (e.g. S003, S004). Matches MILESTONE_MAP.md.
#   P[program]  — Delivery stream within the stage (e.g. P001, P002). Groups related WPs.
#                 Sequential within the stage. P001 = first program in stage.
#   WP[number]  — Atomic execution unit (e.g. WP001, WP002). Sequential within program.
#
#   Full reference: lean-kit/modules/project-governance/WP_ID_STANDARD.md
#
# DIRECTORY:  _aos/work_packages/[WP-ID]/LOD400_spec.md  (per-WP, required at L-GATE_SPEC)
# STAGE DOC:  _aos/work_packages/S[N]/LOD300_milestone.md (planning doc, covers all WPs in stage)
#
# REGISTRATION RULE:
#   WP MUST be in roadmap.yaml no later than L-GATE_SPEC.
#   Before per-WP LOD400 exists, spec_ref may point to the stage LOD300_milestone.md.
#   At L-GATE_SPEC: spec_ref MUST point to per-WP LOD400_spec.md.

