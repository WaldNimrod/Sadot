                                       # _COMMUNICATION/team_100/GOVERNANCE_CHANGE_REQUEST_LANDSCAPE_DESIGN_ARCHETYPE_INHERITANCE_v1.0.0.md
                                       # (team_110, 2026-07-08). See: methodology/lifecycle-archetypes/README.md
  lean_kit_version: "3.4.0+20e2011"
  created: "2026-07-08"
  owner: "sadot_sd"         # system_designer team ID
  active_milestone: "S002"   # Layer-2 Pre-Revit (pivot 2026-07-28)
  notes: "LAYER-2 PIVOT 2026-07-28 (team_00 ratified; team_100 authored) + LOD200 PUSH same day: advance hard before Michal Revit — vegetation zones LOD200, irrigation+cabinets LOD200, dual-level fish/plant pond that irrigates swim-deck concrete/perlite planters (P006), swim-pool tech (P002). Priority S002: P001→P002→P006→P007→P004→P003→P005. Layer-1=Michal/Revit; Layer-2=Sadot. Gate: S002→Michal→STOP+convert S003→dress S004→S005 (BOQ mandatory). Narrative+process: _COMMUNICATION/team_100/NARRATIVE_LAYER2_PIVOT_2026-07-28_v1.0.0.md + PROCESS_WP_DEPENDENCY_MAP_2026-07-28_v1.0.0.md. API unreachable at first write — spoke YAML local; deploy_cascade when API back."

# WP ID FORMAT: S[stage]-P[program]-WP[number]  (id: field carries an additional SDT- prefix — see note above)
#
#   S[stage]    — Major product milestone (e.g. S003, S004). Matches MILESTONE_MAP.md.
#   P[program]  — Delivery stream within the stage (e.g. P001, P002). Groups related WPs.
#                 Sequential within the stage. P001 = first program in stage.
#   WP[number]  — Atomic execution unit (e.g. WP001, WP002). Sequential within program.
#
#   Full reference: lean-kit/modules/project-governance/WP_ID_STANDARD.md
#
# DIRECTORY:  _aos/work_packages/[WP-ID]/LOD400_spec.md  (per-WP, required at L-GATE_SPEC)
# STAGE DOC:  _aos/work_packages/S[N]/LOD300_milestone.md (planning doc, covers all WPs in stage)
#
# REGISTRATION RULE:
#   WP MUST be in roadmap.yaml no later than L-GATE_SPEC.
#   Before per-WP LOD400 exists, spec_ref may point to the stage LOD300_milestone.md.
#   At L-GATE_SPEC: spec_ref MUST point to per-WP LOD400_spec.md.

