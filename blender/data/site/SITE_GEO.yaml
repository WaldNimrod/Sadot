soil_and_grade:
  composition: "Hamra (חמרה, the region's native reddish sandy-loam soil -- see
    knowledge/climate/ISRAELI_CLIMATE_SOIL_PARDES_HANNA.md for the general regional profile) mixed with a
    substantial amount of construction debris/rubble (זבל בניין) essentially everywhere across the plot."
  current_grade: "Most of the yard area currently sits BELOW the final target grade -- hamra fill will be
    brought in to bring it up to level. This is a planned construction step, not a discovered fact to design
    around passively."
  exception_east_path: "The narrow path east of the house, between the house and the long (eastern) fence, is
    different: existing ground there is ALREADY at a good/correct height (does not need fill) -- but it is
    still just as debris-laden as everywhere else on the plot."
  engineering_implication: "Any excavation anywhere on the plot (pool shell, banana-circle pit, tree planting
    holes, retaining-wall footings) should expect to hit construction rubble, not clean soil -- relevant to
    RESEARCH_FINDINGS_POOL_CONSTRUCTION_v1.0.0.md's open geotechnical question and to footing/planting-hole
    costing generally. Still NOT a substitute for a real geotechnical/soil lab test before final engineering."
