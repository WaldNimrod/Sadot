sun_and_shade:
  general: "Full sun from sunrise, nearly all day, across almost the entire garden."
  west_afternoon: "In the afternoon, the neighbor's house to the west (Tasi, per client_brief sec 8) casts some
    shade."
  west_fence_winter: "Along the western fence -- the fence line the house itself is built close/adjacent to --
    shade forms mainly in winter (low sun angle)."
  north_back_yard: "The back yard (the north side) is shaded most of the day -- consistent with the house's
    own orientation (the house blocks southward sun from reaching its own north side for much of the day)."
  source: "team_00, 2026-07-10 (direct/first-hand qualitative observation, not an instrument-measured sun-path
    study)."

