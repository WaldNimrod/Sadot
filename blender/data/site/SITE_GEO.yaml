approximate_corner_elevations_v1:
  note: "Per-corner elevations read directly from the nearest visually-adjacent spot-height label to each
    boundary point (600 DPI re-scan, 2026-07-09) — NOT the surveyor's own formal point-elevation list (this
    survey's coordinate table has no elevation column). Treat as indicative, not survey-grade. Used only to
    give blender/data/site/boundary_points_v1.csv + terrain.obj (v1) a non-flat reference surface.
    IMPORTANT CAVEAT (2026-07-09, added after team_00 clarified): the client states the WHOLE site underwent
    construction/grading since this 2023 survey — the survey's own internal spot-elevations (used to derive these
    per-corner numbers) may no longer represent CURRENT real ground conditions, especially anywhere near the new
