# raw-materials/ itself is git-ignored — this file is the CURATED, tracked extraction.

site_id: sadot_niv_pardes_hanna
status: partial — plot boundary, elevations, and orientation confirmed by licensed survey; sun/shade + soil-test
  still pending; more client materials expected in future batches (see hub/data/materials-needed.json)
updated: '2026-07-09'
approved_by: team_00

# SCOPE NOTE: the survey PDF (10111TD122) is authoritative ONLY for the plot boundary and elevation/topography
# data below — it does NOT depict the current house (that layer shows the OLD, since-replaced house/structures).
# Full explanation + rationale: design/CANONICAL/02_SPATIAL_SSOT_and_GEOMETRY.md §⚠ Survey validity scope.
# Do not restate the full rationale here — that section is the single canonical copy.

# Legal/registry identity (from the survey title block)
registry:
  settlement: "פרדס חנה (Pardes Hanna)"
  street: "רוד/רחוב גמלא (Gamla St.)"
  gush: 10111
  helka: 122
  registered_area_sqm: 752
  plot_area_sqm: 752
  survey_ref: "10111TD122, קנה מידה 1:250, מודדי עירון (מודד מוסמך), חתום 22.08.2023"
  adjacent_parcels: [119, 120, 121, 270, 57, 28]
  note: "Parcel 28 is marked 'שטח חלקאי' (agricultural/cultivated land) on the drawing. Compass direction relative to plot 122 is NOT asserted in this registry block itself — see `orientation` below (RESOLVED 2026-07-08) for the actual bearing."

# Client-supplied approximate WGS84 pin (received via chat, 2026-07-08) — for map/orientation reference.
# NOT construction-grade precision; the survey `boundary_itm` below is the authoritative geometry.
wgs84:
  latitude: 32.46428
  longitude: 34.96231
  source: "Client-supplied pin (Niv Sadot), 2026-07-08"
  accuracy_m: null
  note: "Consistent with Pardes Hanna-Karkur's real-world location — used for map/orientation only, not set-out."

# Authoritative plot boundary, from the licensed survey's own coordinate list (רשימת קואורדינטות,
# מאוזן/צפון-מזרח columns). Grid: Israeli New Grid / ITM-compatible (per geo_itm.py's EPSG:2039 assumption) —
# NOT independently re-verified against the survey's own datum note; treat as ITM pending confirmation.
boundary_itm:
  epsg: 2039
  points:
    - {id: "1G", easting_m: 196695.299, northing_m: 707864.034}
    - {id: "2G", easting_m: 196701.014, northing_m: 707864.620}
    - {id: "3G", easting_m: 196694.530, northing_m: 707812.220}
    - {id: "4G", easting_m: 196684.489, northing_m: 707813.303}
    - {id: "5G", easting_m: 196680.410, northing_m: 707860.480}
    - {id: "6G", easting_m: 196695.580, northing_m: 707862.030}
  note: "6-point plot boundary polygon, order as listed in the survey's coordinate table. Use with geo_itm.py for Blender world-space placement once a site-anchor convention is set."

# Spot elevations visible on the survey (representative range only — not a full grid; see the PDF itself
# under raw-materials/from-client/ for the full scatter of ~40+ spot heights across the plot).
elevation:
  unit: meters
  approx_range: [54.47, 57.59]
  note: "Meters above the survey's own datum (assumed local/national leveling datum — not independently confirmed). Full spot-height scatter is on the source PDF; digitize during S003 site-anchoring if a precise grading model is needed."

# Existing vegetation — tree schedule from the survey's לוח עצים (tree schedule) table.
