# reconciliation against the boundary_itm points above. See design/CANONICAL/BLENDER_SHELL_BUILD_PLAN_v1.0.0.md §3
# for the full method and the measurement request. Coordinates below are in the IFC's OWN internal world coordinate
# system (arbitrary Revit origin) — NOT yet in ITM. UPDATE (2026-07-09): the "rotation ≈ 0" assumption below was
# wrong (or doesn't apply to ifcopenshell.geom's USE_WORLD_COORDS output) — see fence_edge_candidate_transform
# below for a strong, numerically well-supported candidate rotation of ~105.3°, found independently of this
# tie-measurement plan. This tie-measurement plan (translation-only, assuming zero rotation) is now superseded as
# the primary approach, but kept here since it remains a valid independent cross-check once real measurements
# exist. [Original text, now only partially accurate:] Rotation between the two systems was believed to be ~zero
# (both independently claim true-north alignment); only a translation offset was thought to need solving, via 2
# real-world distance measurements from 2 known boundary_itm points to each of these 2 corners (4 measurements total).
house_reference_corners:
  status: "AWAITING team_00 on-site tie-measurement (or the architect's equivalent Revit measurements — see
    _COMMUNICATION/team_70/DRAFT_MESSAGE_TO_MICHAL_SITE_PLAN_v1.0.0.md, a parallel channel not yet sent) — see
    BLENDER_SHELL_BUILD_PLAN_v1.0.0.md §3 for the 4 distances needed"
  ifc_native_coords:
    - id: front_corner
      x: -411197.429
      y: -270528.236
      z: 57.68
      description: "Outside corner ~2m from the kitchen/deck door, on the straight wall where the deck's straight edge (not its round arc) meets the house."
    - id: back_corner
      x: -411206.746
      y: -270527.663
      z: 57.69
      description: "Outside corner of the children's-bedroom wing (window tag 5834063's room), where the back wall turns into a ~22m exterior wall run — a genuine major footprint corner."
  internal_baseline_m: 9.33

# RETRACTED (2026-07-09, third pass): the fence-wall/edge-3G-4G rotation hypothesis below (105.28 deg) was a bad
# correspondence -- see rotation_resolution below for the rigorous replacement. Kept, struck through in spirit
# (not deleted, per this project's own convention of recording corrections rather than silently erasing them),
# so a future reader can see exactly what was tried and why it was wrong.
fence_edge_candidate_transform_RETRACTED:
  status: "RETRACTED 2026-07-09 -- superseded by rotation_resolution below. Was: 'STRONG CANDIDATE, not
    independently confirmed'. The 3-9cm endpoint agreement that made this look strong was coincidental --
    rigorous placement-hierarchy analysis (3 independent methods) proves the real IFC-to-ITM rotation is 0 deg,
    not 105.28 deg. walls_119777 is NOT the real edge 3G->4G fence; this was simply the wrong wall matched
    against the wrong survey edge."
  rotation_deg_ccw_about_z_WRONG: 105.28146223928564

# Rotation question RESOLVED (2026-07-09, third pass) -- see design/CANONICAL/HOUSE_IFC_REFERENCE.md sec 0.1 for
# full narrative. Summary: walked the IFC's own IfcLocalPlacement hierarchy directly (Project->Site->Building->all
# 5 storeys) via 3 independent methods (raw STEP Axis/RefDirection, composed 4x4 matrix decomposition, and
# independent PCA on actual world-coordinate geometry). Every containment level carries an identity rotation to
# full float precision. The original "rotation ~= 0" assumption (before the fence-wall detour) was CORRECT.
rotation_resolution:
  status: "RESOLVED -- rotation = 0.000000 deg (translation-only) between IFC world coords and real ITM grid,
    confirmed by 3 independent methods against the IFC's own placement data (not a heuristic wall/edge match)."
  caveat: "This rests on the IFC's declared TrueNorth (exactly local +Y) actually being real, surveyed true north
    -- and that exactness looks like an untouched Revit default (Project North never rotated to True North), not
    a deliberately-set value. Best supporting evidence it's directionally right anyway: door #7639 (2.8m glass
    door, wall #2391, near the deck) faces real bearing 159.26 deg (SSE) under this assumption -- ~21 deg off
    true south, matching the client's own 'roughly south' statement. See HOUSE_IFC_REFERENCE.md sec 4 for the
    corrected deck-door identification (door #7639, not the originally-cited #112958, which faces ENE)."
  used_in: "blender/sadot_v1_initial.blend -- terrain rotation reverted to 0 deg, 2026-07-09 third pass."

# Translation (X/Y position) remains OPEN -- unchanged from the original plan, no shortcut was found:
translation_still_open:
