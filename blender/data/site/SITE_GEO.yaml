# Soil composition + sun/shade pattern (2026-07-10, team_00) -- real, first-hand qualitative site knowledge,
# answering (in part) the still-open P002-WP004 research item. NOT a substitute for a formal geotechnical soil
# lab test, and NOT yet the rigorous multi-date/multi-hour sun-path model that S002 explicitly needs (see
