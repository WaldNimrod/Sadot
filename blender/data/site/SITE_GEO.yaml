    true south, matching the client's own 'roughly south' statement. See HOUSE_IFC_REFERENCE.md sec 4 for the
    corrected deck-door identification (door #7639, not the originally-cited #112958, which faces ENE)."
  used_in: "blender/sadot_v1_initial.blend -- terrain rotation reverted to 0 deg, 2026-07-09 third pass."

