# Authoritative plot boundary, from the licensed survey's own coordinate list (רשימת קואורדינטות,
# מאוזן/צפון-מזרח columns). Grid: Israeli New Grid / ITM-compatible (per geo_itm.py's EPSG:2039 assumption) —
# NOT independently re-verified against the survey's own datum note; treat as ITM pending confirmation.
boundary_itm:
  epsg: 2039
  points:
    - {id: "1G", easting_m: 196695.299, northing_m: 707864.034}
    - {id: "2G", easting_m: 196701.014, northing_m: 707864.620}
    - {id: "3G", easting_m: 196694.530, northing_m: 707812.220}
    - {id: "4G", easting_m: 196684.489, northing_m: 707813.303}
    - {id: "5G", easting_m: 196680.410, northing_m: 707860.480}
    - {id: "6G", easting_m: 196695.580, northing_m: 707862.030}
  note: "6-point plot boundary polygon, order as listed in the survey's coordinate table. Use with geo_itm.py for Blender world-space placement once a site-anchor convention is set."

# Spot elevations visible on the survey (representative range only — not a full grid; see the PDF itself
